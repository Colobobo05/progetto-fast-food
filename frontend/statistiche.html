<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistiche - Fast Food</title>
    <link rel="icon" type="image/png" href="./loghi/logo2.png">
    <link rel="stylesheet" href="./index/styleindex.css">
    <style>
        .stats-container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: #1a1a1a; padding: 30px; border-radius: 12px; border-top: 4px solid var(--accent-color); text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .stat-card h3 { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 10px; }
        .stat-card .number { font-size: 3rem; font-weight: bold; color: white; }
        
        .top-dishes { background: #1a1a1a; padding: 30px; border-radius: 12px; border: 1px solid #333; }
        .top-dishes ul { list-style: none; padding: 0; }
        .top-dishes li { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #333; font-size: 1.2rem; }
        .top-dishes li:last-child { border-bottom: none; }
        .badge-venduti { background: var(--accent-color); color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 1rem; }
    </style>
</head>

                    <div class="dropdown-content">
                        <a href="profilo.html">I miei Dati</a> 
                        <a href="ristorante.html" class="classe-ristoratore" style="color: var(--accent-color); font-weight: bold;">Il mio Ristorante</a>
                        <a href="gestione-ordini.html" class="classe-ristoratore" style="color: #f39c12; font-weight: bold;">gestione Cucina</a>
                        <a href="statistiche.html" class="classe-ristoratore" style="color: #3498db; font-weight: bold;">Statistiche</a>
                        <a href="ordini.html#active-orders" class="classe-cliente">Ordine Attuale</a>
                        <a href="ordini.html#past-orders" class="classe-cliente">Storico Ordini</a>
                        <a href="#" id="logout-btn" style="color: #e74c3c !important;">Log Out</a>

        <h1 style="text-align: center; margin-bottom: 2rem;">Le Tue <span style="color: var(--accent-color);">Statistiche</span> </h1>
        
        <div id="stats-content">
            <p style="text-align: center; color: var(--text-muted);">Caricamento dati aziendali...</p>
