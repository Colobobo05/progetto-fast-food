<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetrina - Fast Food</title>
    <link rel="icon" type="image/png" href="./loghi/logo2.png">
    <link rel="stylesheet" href="./index/styleindex.css">
    <style>
        .vetrina-header { position: relative; height: 350px; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 40px 10%; margin-top: 80px; }
        .vetrina-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, rgba(17,17,17,1) 0%, rgba(17,17,17,0.3) 100%); }
        .vetrina-info { position: relative; z-index: 2; }
        .vetrina-info h1 { font-size: 3rem; margin-bottom: 5px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .vetrina-info p { color: #ddd; font-size: 1.2rem; }
        .menu-section { padding: 50px 10%; max-width: 1200px; margin: 0 auto; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; margin-top: 30px; }
        .dish-card { background: #1a1a1a; border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: 0.3s ease; }
        .dish-card:hover { border-color: var(--accent-color); transform: translateY(-5px); }
        .dish-img { width: 100%; height: 200px; object-fit: cover; }
        .dish-content { padding: 20px; }
        .dish-title { font-size: 1.3rem; font-weight: bold; color: white; margin-bottom: 5px; }
        .dish-ingredients { color: #aaa; font-size: 0.85rem; margin-bottom: 15px; height: 40px; overflow: hidden; }
        .dish-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border-top: 1px solid #333; padding-top: 15px; }
        .dish-price { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); }
        .btn-add-cart { background: var(--accent-color); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-add-cart:hover { opacity: 0.8; transform: scale(1.05); }
    </style>
</head>
