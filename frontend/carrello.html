<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il tuo Carrello - Fast Food</title>
    <link rel="icon" type="image/png" href="./loghi/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="index/styleindex.css">
    
    <style>
        .cart-container { max-width: 800px; margin: 0 auto; background: var(--bg-surface); padding: 2rem; border-radius: var(--border-radius-soft); }
        .cart-item { display: flex; align-items: center; gap: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 1rem 0; }
        .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; }
        .cart-item-info { flex: 1; }
        .btn-remove { background: #ff4757; color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .cart-total { font-size: 1.5rem; font-weight: bold; text-align: right; margin-top: 2rem; color: var(--accent-color); }
        .btn-checkout { background: var(--accent-color); color: #000; width: 100%; padding: 1rem; border: none; border-radius: 50px; font-size: 1.2rem; font-weight: bold; margin-top: 1rem; cursor: pointer; transition: 0.3s; }
        .btn-checkout:hover { transform: scale(1.02); box-shadow: 0 0 15px var(--accent-color); }
    </style>
</head>
<body>

            <header>
            <div class="logo">
                <a href="index.html"><img src="./loghi/logo.png" alt="Logo del sito"></a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Ristoranti</a></li>
                    
                    <li id="nav-accedi"><a href="accedi.html">Accedi</a></li>
                    
                    <li id="nav-profilo" class="nav-item-dropdown" style="display: none;">
                        <a href="#" class="profilo-link">Profilo</a>
                        <div class="dropdown-content">
                            <a href="profilo.html"> I miei Dati</a> 
                            
                            <a href="ristorante.html" class="classe-ristoratore" style="color: var(--accent-color); font-weight: bold;">Il mio Ristorante</a>
                            <a href="gestione-ordini.html" class="classe-ristoratore" style="color: #f39c12; font-weight: bold;">Gestione Cucina</a>
                            <a href="statistiche.html" class="classe-ristoratore" style="color: #3498db; font-weight: bold;">Statistiche</a>
                            
                            <a href="ordini.html#active-orders" class="classe-cliente">Ordine Attuale</a>
                            <a href="ordini.html#past-orders" class="classe-cliente">Storico Ordini</a>
                            
                            <a href="#" id="logout-btn" style="color: #e74c3c !important;">Log Out</a>
                        </div>
                    </li>
                    
                    <li><a href="carrello.html" style="color: var(--accent-color); font-weight: bold;">Carrello</a></li>
                </ul>
            </nav>
        </header>

    <main style="margin-top: 150px; min-height: 60vh; padding: 0 5%;">
        <h1 style="text-align: center; margin-bottom: 2rem;">Il tuo <span style="color: var(--accent-color);">Carrello</span> </h1>
        
        <div class="cart-container" id="cart-container">
            </div>
    </main>


    <div id="payment-modal" class="modal">
        <div class="modal-content payment-box" style="max-width: 500px;">
            <span class="close-modal">&times;</span>
            <h2 style="text-align: center; margin-bottom: 20px;"> Pagamento Sicuro</h2>
            
            <div class="credit-card-visual" style="background-image: url('./loghi/cartacredito.png'); background-size: cover; background-position: center; border: none; height: 200px; position: relative; border-radius: 15px; margin-bottom: 25px; color: white; font-family: 'Courier New', monospace; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
                <div class="card-number" style="position: absolute; top: 110px; left: 20px; font-size: 1.5rem; letter-spacing: 2px; width: 90%; text-align: left;">#### #### #### ####</div>
                <div class="card-holder-name" style="position: absolute; bottom: 30px; left: 20px; font-size: 1rem; text-transform: uppercase;">NOME COGNOME</div>
                <div class="card-expiry-date" style="position: absolute; bottom: 30px; right: 20px; font-size: 1rem;">MM/YY</div>
            </div>

            <form id="payment-form">
                <div class="form-group">
                    <label>Nome sulla Carta</label>
                    <input type="text" id="card-name" class="auth-input" placeholder="Mario Rossi" required>
                </div>
                <div class="form-group">
                    <label>Numero Carta</label>
                    <input type="text" id="card-number-input" class="auth-input" placeholder="1234 5678 9101 2345" maxlength="19" required>
                </div>
                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Scadenza (MM/YY)</label>
                        <input type="text" id="card-expiry-input" class="auth-input" placeholder="12/26" maxlength="5" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>CVV</label>
                        <input type="password" id="card-cvv-input" class="auth-input" placeholder="123" maxlength="3" required>
                    </div>
                </div>
                
                <button type="submit" class="auth-btn" id="btn-conferma-pagamento" style="margin-top: 15px;">
                    Paga € <span id="payment-total-btn">0.00</span> ➔
                </button>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="logo">
                <img src="./loghi/logo.png" alt="Fast Food Logo">
            </div>
            <div class="social-icons">
                <a href="#"><img src="./loghi/facebook.png" alt="Facebook"></a>
                <a href="#"><img src="./loghi/instagram.png" alt="Instagram"></a>
                <a href="#"><img src="./loghi/whatsapp.png" alt="WhatsApp"></a>
                <a href="#"><img src="./loghi/gmail.png" alt="Email"></a>
                
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 Fast Food Colombo Davide 61779A
        </div>
    </footer>

    <script src="./js/app.js"></script>
    <script src="./js/carrello.js"></script>
</body>
</html>
