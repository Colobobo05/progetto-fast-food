<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esplora - Fast Food</title>
    <link rel="icon" type="image/png" href="./loghi/logo2.png">
    <link rel="stylesheet" href="./index/styleindex.css">
    <style>
        .search-container { max-width: 1000px; margin: 150px auto 50px; padding: 0 20px; }
        
        /* Stile Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .tab-btn { background: #333; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: var(--accent-color); color: #000; }
        
        /* Pannelli di ricerca */
        .search-panel { background: #1a1a1a; padding: 30px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 5px 20px rgba(0,0,0,0.5); display: none; }
        .search-panel.active { display: block; }
        
        .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .filter-group { display: flex; flex-direction: column; text-align: left; }
        .filter-group label { margin-bottom: 5px; color: #ddd; font-size: 0.9rem; }
        .filter-input { padding: 12px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; }
        .filter-input:focus { outline: none; border-color: var(--accent-color); }
        
        .btn-cerca { background: var(--accent-color); color: #000; border: none; padding: 12px 30px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.1rem; }
        
        /* Risultati */
        #results-container { margin-top: 40px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html"><img src="./loghi/logo.png" alt="Logo del sito"></a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html" style="color: var(--accent-color); font-weight: bold;">Esplora</a></li>
                <li id="nav-accedi"><a href="accedi.html">Accedi</a></li>
                <li id="nav-profilo" class="nav-item-dropdown" style="display: none;">
                    <a href="#" class="profilo-link">Profilo</a>
                    <div class="dropdown-content">
                        <a href="profilo.html">I miei Dati</a> 
                        <a href="ristorante.html" class="classe-ristoratore">Il mio Ristorante</a>
                        <a href="gestione-ordini.html" class="classe-ristoratore">Gestione Cucina</a>
                        <a href="statistiche.html" class="classe-ristoratore">Statistiche</a>
                        <a href="ordini.html#active-orders" class="classe-cliente">Ordine Attuale</a>
                        <a href="ordini.html#past-orders" class="classe-cliente">Storico Ordini</a>
                        <a href="#" id="logout-btn" style="color: #e74c3c !important;">Log Out</a>
                    </div>
                </li>
                <li><a href="carrello.html">Carrello</a></li>
            </ul>
        </nav>
    </header>

    <main class="search-container">
        <h1 style="text-align: center; margin-bottom: 30px;">Cosa stai cercando? </h1>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('risto')">Ristoranti</button>
            <button class="tab-btn" onclick="switchTab('piatti')">Piatti</button>
        </div>

        <div id="tab-risto" class="search-panel active">
            <form id="form-search-risto">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label>Nome Ristorante</label>
                        <input type="text" id="srch-risto-nome" class="filter-input" placeholder="Es. Burger King">
                    </div>
                    <div class="filter-group">
                        <label>Luogo / Città</label>
                        <input type="text" id="srch-risto-luogo" class="filter-input" placeholder="Es. Milano">
                    </div>
                </div>
                <button type="submit" class="btn-cerca">Cerca Ristoranti</button>
            </form>
        </div>

        <div id="tab-piatti" class="search-panel">
            <form id="form-search-piatti">
                <div class="filters-grid">
                    <div class="filter-group">
                        <label>Nome Piatto</label>
                        <input type="text" id="srch-piatto-nome" class="filter-input" placeholder="Es. Cheeseburger">
                    </div>
                    <div class="filter-group">
                        <label>Tipologia</label>
                        <select id="srch-piatto-tipo" class="filter-input">
                            <option value="Tutte">Tutte le categorie</option>
                            <option value="Panino">Panino</option>
                            <option value="Pizza">Pizza</option>
                            <option value="Sushi">Sushi</option>
                            <option value="Bibita">Bibita</option>
                            <option value="Dolce">Dolce</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Prezzo Massimo (€)</label>
                        <input type="number" id="srch-piatto-prezzo" class="filter-input" step="0.5" min="1" placeholder="Es. 15">
                    </div>
                </div>
                <button type="submit" class="btn-cerca">Cerca Piatti</button>
            </form>
        </div>

        <div id="results-container">
            </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="logo">
                <img src="./loghi/logo.png" alt="Fast Food Logo">
            </div>
            <div class="social-icons">
                <a href="#"><img src="./loghi/facebook.png" alt="Facebook"></a>
                <a href="#"><img src="./loghi/instagram.png" alt="Instagram"></a>
                <a href="#"><img src="./loghi/whatsapp.png" alt="WhatsApp"></a>
                <a href="#"><img src="./loghi/gmail.png" alt="Email"></a>
                
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 Fast Food Colombo Davide 61779A
        </div>
    </footer>
    
    <script src="./app.js"></script>
    <script src="./js/menu-ricerca.js"></script>
</body>
</html>
