 <!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi o Registrati - Fast Food</title>
    <link rel="icon" type="image/png" href="./loghi/logo2.png">
    <link rel="stylesheet" href="./index/styleindex.css">
    <style>
        .auth-wrapper {
            display: flex;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto; 
            background: #1a1a1a;
            border-radius: 12px;
            border: 1px solid var(--accent-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .auth-side {
            flex: 1;
            padding: 3rem;
        }
        .auth-divider {
            width: 1px;
            background: #333;
        }
        .auth-input, .auth-select { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 6px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: white; 
            box-sizing: border-box;
            font-family: inherit;
        }
        .auth-select { cursor: pointer; }
        .auth-btn { 
            width: 100%; 
            padding: 12px; 
            background: var(--accent-color); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 1.1rem;
            margin-top: 15px; 
            transition: 0.3s;
        }
        .auth-btn:hover { opacity: 0.8; }

        @media (max-width: 768px) {
            .auth-wrapper { flex-direction: column; }
            .auth-divider { width: 100%; height: 1px; }
        }
    </style>
</head>
<body>
            <header>
            <div class="logo">
                <a href="index.html"><img src="./loghi/logo.png" alt="Logo del sito"></a>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Ristoranti</a></li>
                    
                    <li id="nav-accedi"><a href="accedi.html">Accedi</a></li>
                    
                    <li id="nav-profilo" class="nav-item-dropdown" style="display: none;">
                        <a href="#" class="profilo-link">Profilo</a>
                        <div class="dropdown-content">
                            <a href="profilo.html">I miei Dati</a> 
                            
                            <a href="ristorante.html" class="classe-ristoratore" style="color: var(--accent-color); font-weight: bold;">Il mio Ristorante</a>
                            <a href="gestione-ordini.html" class="classe-ristoratore" style="color: #f39c12; font-weight: bold;">Gestione Cucina</a>
                            <a href="statistiche.html" class="classe-ristoratore" style="color: #3498db; font-weight: bold;">Statistiche</a>
                            
                            <a href="ordini.html#active-orders" class="classe-cliente">Ordine Attuale</a>
                            <a href="ordini.html#past-orders" class="classe-cliente">Storico Ordini</a>
                            
                            <a href="#" id="logout-btn" style="color: #e74c3c !important;">Log Out</a>
                        </div>
                    </li>
                    
                    <li><a href="carrello.html" style="color: var(--accent-color); font-weight: bold;">Carrello</a></li>
                </ul>
            </nav>
        </header>

    <main style="padding-top: 200px; padding-bottom: 50px; min-height: 80vh;">
        <div class="auth-wrapper">
            
            <div class="auth-side">
                <h2 style="margin-bottom: 1.5rem;">benvenuto <span style="color: var(--accent-color);">Registrati</span></h2>
                <form id="register-form">
                    <select id="reg-role" class="auth-select" required>
                        <option value="" disabled selected>Chi sei?</option>
                        <option value="Cliente">Cliente </option>
                        <option value="Ristoratore">Ristoratore </option>
                    </select>
                    
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="reg-nome" class="auth-input" placeholder="Nome" required>
                        <input type="text" id="reg-cognome" class="auth-input" placeholder="Cognome" required>
                    </div>
                    
                    <input type="email" id="reg-email" class="auth-input" placeholder="La tua Email" required>
                    <input type="password" id="reg-password" class="auth-input" placeholder="Crea una Password" required>
                    
                    <div id="extra-client-fields" style="display: none; background: #222; padding: 15px; border-radius: 6px; margin-top: 10px; border: 1px dashed #555;">
                        <p style="margin-top: 0; margin-bottom: 10px; font-size: 0.9rem; color: var(--accent-color);">💳 Dati extra per i Clienti:</p>
                        
                        <select id="reg-pagamento" class="auth-select">
                            <option value="" disabled selected>Metodo di Pagamento Preferito</option>
                            <option value="Carta di Credito">Carta di Credito</option>
                            <option value="Carta Prepagata">Carta Prepagata</option>
                        </select>
                        
                        <p style="margin-top: 10px; margin-bottom: 5px; font-size: 0.8rem; color: #ccc;"> Preferenze e Offerte:</p>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.8rem; color: #fff;">
                            <label><input type="checkbox" class="reg-pref" value="Offerte Speciali"> Offerte Speciali</label>
                            <label><input type="checkbox" class="reg-pref" value="Cibo Vegano"> Cibo Vegano</label>
                            <label><input type="checkbox" class="reg-pref" value="Senza Glutine"> Senza Glutine</label>
                        </div>
                    </div>
                    <button type="submit" class="auth-btn">Crea Account</button>
                </form>
            </div>

            <div class="auth-divider"></div>

            <div class="auth-side">
                <h2 style="margin-bottom: 1.5rem;">Bentornato! <span style="color: var(--accent-color);">Accedi</span></h2>
                <form id="login-form">
                    <input type="email" id="login-email" class="auth-input" placeholder="La tua Email" required>
                    <input type="password" id="login-password" class="auth-input" placeholder="Password" required>
                    
                    <button type="submit" class="auth-btn">Accedi</button>
                </form>
            </div>

        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="logo">
                <img src="./loghi/logo.png" alt="Fast Food Logo">
            </div>
            <div class="social-icons">
                <a href="#"><img src="./loghi/facebook.png" alt="Facebook"></a>
                <a href="#"><img src="./loghi/instagram.png" alt="Instagram"></a>
                <a href="#"><img src="./loghi/whatsapp.png" alt="WhatsApp"></a>
                <a href="#"><img src="./loghi/gmail.png" alt="Email"></a>
                
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 Fast Food Colombo Davide 61779A
        </div>
    </footer>

    <script src="./js/app.js"></script>
    <script src="./js/accedi.js"></script>
</body>
</html>
